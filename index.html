/* =====================================================

===================================================== */

function initSupabase(){

    if(
        typeof window.supabase === "undefined" ||
        !window.supabase.createClient
    ){

        console.error("Supabase library did not load.");

        return false;
    }


    try{

        const SUPABASE_URL =
            "https://uyjwaquunhravgwydnzu.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_H0vUq7vQ9Hhp_PvVwlfGGA_EQkwp2RP";


        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        console.log(
            "VIRA Supabase connected."
        );


        return true;

    }
    catch(error){

        console.error(
            "Supabase initialization error:",
            error
        );

        return false;
    }

}

    const box =
        document.getElementById(
            "notification"

    if(!box){

    }

    box.textContent = text;

    box.style.display = "block";


    setTimeout(function(){

        box.style.display = "none";

    },3000);

}

/* =====================================================
   ADMIN LOGIN
===================================================== */

async function loginAdmin(){

    const errorBox =
        document.getElementById(
            "adminError"
        );


    const email =
        document
            .getElementById("adminUsername")
            .value
            .trim();


    const password =
        document
            .getElementById("adminPassword")
            .value;


    if(!email || !password){

        errorBox.textContent =
            "ایمیل و رمز عبور را وارد کنید.";

        return;
    }


    if(!supabaseClient){

        const connected =
            initSupabase();


        if(!connected){

            errorBox.textContent =
                "اتصال به Supabase برقرار نشد.";

            return;
        }

    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "در حال ورود...";


    errorBox.textContent = "";


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if(error){

            console.error(error);

            button.disabled = false;

            button.textContent =
                "ورود";


            errorBox.textContent =
                "ایمیل یا رمز عبور اشتباه است.";

            return;
        }


        await checkAdminProfile(
            data.user.id
        );

    }
    catch(error){

        console.error(error);

        button.disabled = false;

        button.textContent =
            "ورود";


        errorBox.textContent =
            "خطا در اتصال به سرور.";

    }

}


/* =====================================================
   CHECK PROFILE
===================================================== */

async function checkAdminProfile(userId){

    const {
        data:profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", userId)
            .single();


    if(error){

        console.error(error);


        showAdminError(
            "حساب شما در جدول profiles ثبت نشده است."
        );

        return;
    }


    if(!profile){

        showAdminError(
            "پروفایل مدیر پیدا نشد."
        );

        return;
    }


    if(profile.is_active === false){

        showAdminError(
            "این حساب غیرفعال است."
        );

        return;
    }


    if(
        ![
            "owner",
            "admin",
            "staff"
        ].includes(profile.role)
    ){

        showAdminError(
            "این حساب اجازه ورود به پنل را ندارد."
        );

        return;
    }


    currentProfile =
        profile;


    loadAdminPanel();

}

/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    if(!supabaseClient){

        return;
    }


    const {
        data:orders,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    const loading =
        document.getElementById(
            "adminLoading"
        );


    const container =
        document.getElementById(
            "ordersContainer"
        );


    if(loading){

        loading.style.display =
            "none";
    }


    if(error){

        console.error(error);


        container.innerHTML = `

            <div class="order">

                <p style="
                    color:#ff8a8a;
                ">

                    ❌ خطا در دریافت سفارش‌ها

                </p>

                <p style="
                    color:#777f91;
                    font-size:12px;
                    margin-top:10px;
                ">

                    ${escapeHtml(
                        error.message
                    )}

                </p>

            </div>

        `;

        return;
    }


    const list =
        orders || [];


    const total =
        list.length;


    const newCount =
        list.filter(
            x =>
                (x.status || "new") === "new"
        ).length;


    const doneCount =
        list.filter(
            x =>
                x.status === "done"
        ).length;


    container.innerHTML = `

        <div class="stats">

            <div class="stat">

                <strong>
                    ${total}
                </strong>

                <span>
                    کل سفارش‌ها
                </span>

            </div>


            <div class="stat">

                <strong>
                    ${newCount}
                </strong>

                <span>
                    سفارش جدید
                </span>

            </div>


            <div class="stat">

                <strong>
                    ${doneCount}
                </strong>

                <span>
                    تکمیل‌شده
                </span>

            </div>

        </div>


        <div class="order-list">

            ${
                list.length
                ?
                list.map(
                    createOrder
                ).join("")
                :
                `
                    <div class="order">

                        <p style="
                            text-align:center;
                            color:#888f9f;
                        ">

                            هنوز سفارشی ثبت نشده است.

                        </p>

                    </div>
                `
            }

        </div>

    `;

}


/* =====================================================
   ORDER
===================================================== */

function createOrder(order){

    const status =
        order.status || "new";


    let statusText =
        "🆕 جدید";


    let statusClass =
        "status-new";


    if(status === "progress"){

        statusText =
            "🔄 در حال انجام";

        statusClass =
            "status-progress";

    }


    if(status === "done"){

        statusText =
            "✅ تکمیل شده";

        statusClass =
            "status-done";

    }


    const date =
        order.created_at
        ?
        new Date(
            order.created_at
        ).toLocaleString(
            "fa-IR"
        )
        :
        "بدون تاریخ";


    return `

        <div class="order">

            <div class="order-top">

                <div>

                    <div class="order-name">

                        👤
                        ${escapeHtml(
                            order.name ||
                            "بدون نام"
                        )}

                    </div>

                    <div class="order-date">

                        ${date}

                    </div>

                </div>


                <strong>

                    ${escapeHtml(
                        order.order_type ||
                        "سفارش"
                    )}

                </strong>

            </div>


            <div class="order-info">

                📞
                ${escapeHtml(
                    order.phone || "-"
                )}

                <br>

                ✉️
                ${escapeHtml(
                    order.email || "-"
                )}

            </div>


            <div class="order-info">

                📝
                ${escapeHtml(
                    order.description ||
                    "بدون توضیحات"
                )}

            </div>


            <span
                class="status ${statusClass}">

                ${statusText}

            </span>


            ${
                order.is_special
                ?
                `
                    <span class="special-tag">

                        ⭐ سفارش ویژه

                    </span>
                `
                :
                ""
            }


            <div class="order-actions">

                <button
                    onclick="changeStatus(
                        '${escapeAttr(order.id)}',
                        'new'
                    )">

                    🆕 جدید

                </button>


                <button
                    onclick="changeStatus(
                        '${escapeAttr(order.id)}',
                        'progress'
                    )">

                    🔄 در حال انجام

                </button>


                <button
                    onclick="changeStatus(
                        '${escapeAttr(order.id)}',
                        'done'
                    )">

                    ✅ تکمیل

                </button>


                <button
                    onclick="deleteOrder(
                        '${escapeAttr(order.id)}'
                    )">

                    🗑 حذف

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(
    id,
    status
){

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({
                status:status
            })
            .eq(
                "id",
                id
            );


    if(error){

        console.error(error);

        alert(
            "تغییر وضعیت انجام نشد."
        );

        return;
    }


    await loadOrders();


    showNotification(
        "✅ وضعیت سفارش تغییر کرد"
    );

}


/* =====================================================
   DELETE ORDER
===================================================== */

async function deleteOrder(id){

    if(
        !confirm(
            "این سفارش حذف شود؟"
        )
    ){

        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        console.error(error);

        alert(
            "حذف سفارش انجام نشد."
        );

        return;
    }


    await loadOrders();


    showNotification(
        "🗑 سفارش حذف شد"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logoutAdmin(){

    if(supabaseClient){

        await supabaseClient.auth
            .signOut();

    }


    currentProfile =
        null;


    openAdmin();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttr(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "'",
        "\\'"
    );

}
